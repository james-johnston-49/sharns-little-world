<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sharn's Little World</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Internal game resolution. CSS scales it to fit the window. -->
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Transformation dial: shown while choosing a form -->
    <div id="dial" hidden>
      <div id="dial-panel">
        <ul id="dial-list"></ul>
        <p id="dial-hint">
          Left and Right to choose. Enter or Shift to transform. Esc to cancel.
        </p>
      </div>
    </div>

    <script src="data/trainer.js"></script>
    <script src="data/pokemon.js"></script>
    <script src="title.js"></script>
    <script src="main.js"></script>
  </body>
</html>
